services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shampass
      POSTGRES_PASSWORD: shampass
      POSTGRES_DB: shampass
    volumes:
      - shampass-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shampass -d shampass"]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://shampass:shampass@db:5432/shampass?schema=public
      JWT_SECRET: shampass-dev-secret
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  shampass-pg:
